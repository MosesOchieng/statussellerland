kind = "web"
previewPath = "/"
title = "StatusSeller"
description = "A polished landing page for StatusSeller, the social commerce layer that turns product posts into interactive shopping, chat, payment, and order workflows for growing businesses."
version = "1.0.0"
id = "artifacts/statusseller-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22755

[services.development]
run = "pnpm --filter @workspace/statusseller-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/statusseller-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/statusseller-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22755"
BASE_PATH = "/"
